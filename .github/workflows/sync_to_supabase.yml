name: Sync Keep to Supabase

# 每天北京时间 8:00 同步（UTC 0:00），也可手动触发
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    paths:
      - scripts/keep_sync_supabase.py
      - .github/workflows/sync_to_supabase.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets configured
        env:
          KEEP_MOBILE: ${{ secrets.KEEP_MOBILE }}
          KEEP_PASSWORD: ${{ secrets.KEEP_PASSWORD }}
        run: |
          missing=0
          if [ -z "$KEEP_MOBILE" ]; then echo "::error::KEEP_MOBILE 未配置，请在 Settings → Secrets and variables → Actions 添加"; missing=1; else echo "KEEP_MOBILE 已配置（长度 ${#KEEP_MOBILE}）"; fi
          if [ -z "$KEEP_PASSWORD" ]; then echo "::error::KEEP_PASSWORD 未配置，请在 Settings → Secrets and variables → Actions 添加"; missing=1; else echo "KEEP_PASSWORD 已配置"; fi
          if [ "$missing" = "1" ]; then exit 1; fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync Keep workouts to Supabase
        env:
          KEEP_MOBILE: ${{ secrets.KEEP_MOBILE }}
          KEEP_PASSWORD: ${{ secrets.KEEP_PASSWORD }}
        run: python scripts/keep_sync_supabase.py
