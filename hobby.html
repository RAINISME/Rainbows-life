<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rainbow's life</title>
  <meta name="description" content="Rainbow's life 的兴趣细分" />
  <link rel="stylesheet" href="assets/css/style.css?v=33" />
</head>
<body class="subpage-body">
  <!-- 音乐播放器（全站常驻，跨页保持曲目与进度） -->
  <div class="music" id="musicBox">
    <audio id="bgMusic" preload="none" playsinline webkit-playsinline></audio>
    <div class="music__row">
      <span class="music__disc" id="musicDisc">🎵</span>
      <div class="music__meta">
        <div class="music__title" id="musicTitle">曾经最爱</div>
        <div class="music__artist" id="musicArtist">歌唱者：彩虹</div>
      </div>
      <button class="music__btn music__btn--sm" id="musicPrev" type="button" aria-label="上一首">⏮</button>
      <button class="music__btn" id="musicToggle" type="button" aria-label="播放">▶</button>
      <button class="music__btn music__btn--sm" id="musicNext" type="button" aria-label="下一首">⏭</button>
    </div>
    <div class="music__playlist">
      <button class="music__list-btn" id="musicListBtn" type="button" aria-label="歌单" aria-expanded="false">☰ <span>歌单</span></button>
      <div class="music__list" id="musicList"></div>
    </div>
    <div class="music__bar"><span class="music__fill" id="musicFill"></span></div>
  </div>

  <!-- 流动渐变背景 -->
  <div class="aurora" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>
  <!-- 摩羯座 文字水印 -->
  <div class="watermark" aria-hidden="true"></div>

  <!-- 返回栏 -->
  <header class="backbar">
    <a href="index.html#hobbies" class="backbar__back">← 返回兴趣</a>
    <a href="index.html" class="backbar__brand">Rainbow's life</a>
    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
  </header>

  <main class="subpage">
    <!-- 内容由 assets/js/hobby.js 根据 ?h= 参数渲染 -->
    <div id="hobbyDetail"></div>
    <p class="footer__visits" id="visitCountBox" hidden>👀 这里是第 <strong id="visitCount">—</strong> 次被看见</p>
  </main>

  <script src="assets/js/data.js?v=33"></script>
  <script src="assets/js/track.js?v=2"></script>
  <script src="assets/js/hobby.js?v=15"></script>
  <script src="assets/js/music.js?v=18"></script>
</body>
</html>
